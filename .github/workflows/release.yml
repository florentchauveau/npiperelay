name: release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: windows-2025
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build amd64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\amd64
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          $env:CGO_ENABLED="0"
          go build -o dist\amd64\npiperelay.exe .

      - name: Build arm64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\arm64
          $env:GOOS="windows"
          $env:GOARCH="arm64"
          $env:CGO_ENABLED="0"
          go build -o dist\arm64\npiperelay.exe .

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: Callr
          certificate-profile-name: npiperelay-public

          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          files-folder-recurse: true

          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        shell: pwsh
        run: |
          Get-AuthenticodeSignature dist\amd64\npiperelay.exe | Format-List
          Get-AuthenticodeSignature dist\arm64\npiperelay.exe | Format-List
